name: Track flights

on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run tracker
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TRAVELPAYOUTS_MARKER: ${{ secrets.TRAVELPAYOUTS_MARKER }}
          CURRENCY: "eur"
          TOP_N: "5"
          MAX_PRICE: "3000"
          DEPART_FROM: "2026-12-23"
          RETURN_TO: "2027-03-31"
          MIN_TRIP_DAYS: "12"
          MAX_TRIP_DAYS: "16"
          DEPART_MONTHS: "2026-12,2027-01,2027-02,2027-03"
        run: python flight_tracker.py
      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain history.json)" ]; then
            git config user.name "flight-bot"
            git config user.email "bot@users.noreply.github.com"
            git add history.json
            git commit -m "Update last run [skip ci]"
            git push
          else
            echo "No changes"
          fi
